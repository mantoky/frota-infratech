# Frota Infratech — Nginx
#
# Serve o export estatico do Next. Nao ha runtime Node em producao: o `out/`
# gerado pelo build e um site estatico puro, e o Firebase (Auth + Firestore)
# continua sendo acessado direto do navegador.
#
# Instalado por deploy/provision.sh em /etc/nginx/sites-available/frota.conf
# O bloco de TLS e acrescentado pelo certbot na primeira emissao.

server {
    listen 80;
    listen [::]:80;
    server_name techartsolucoes.com.br www.techartsolucoes.com.br;

    # `current` e um symlink para a release ativa. A troca e atomica, entao
    # nunca existe um instante servindo build pela metade.
    root /srv/frota/current;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------------
    # Compressao
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Cabecalhos de seguranca
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ATENCAO: `geolocation=(self)` e obrigatorio, nao opcional.
    # O app captura GPS na retirada e na devolucao do veiculo. Um
    # Permissions-Policy que negue geolocalizacao por padrao quebraria essa
    # captura silenciosamente - o fluxo continuaria funcionando, so que sem
    # coordenada nenhuma, e ninguem perceberia ate auditar.
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # ---------------------------------------------------------------------
    # Service worker — NUNCA cachear
    # ---------------------------------------------------------------------
    # O navegador cacheia `sw.js` por padrao. Se o Nginx nao disser o
    # contrario, uma versao nova do app pode nao chegar nunca: o service
    # worker velho continua ativo servindo o cache antigo, e o usuario fica
    # preso numa versao que nao existe mais. Este bloco e o que garante que
    # cada publicacao seja efetivamente entregue.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # ---------------------------------------------------------------------
    # Manifest do PWA
    # ---------------------------------------------------------------------
    # Equivalente ao header que o netlify.toml definia. Sem o content-type
    # correto, parte dos navegadores ignora o manifest e o app deixa de ser
    # instalavel.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---------------------------------------------------------------------
    # Assets com hash no nome — imutaveis
    # ---------------------------------------------------------------------
    # Tudo em /_next/static carrega hash de conteudo no nome do arquivo, entao
    # o conteudo nunca muda para uma mesma URL. Cache de um ano com
    # `immutable` evita revalidacao desnecessaria - relevante em rede de campo.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /vehicles/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Roteamento
    # ---------------------------------------------------------------------
    # Equivalente ao redirect `/* -> /index.html 200` do netlify.toml.
    # `$uri.html` vem antes do fallback porque o export estatico gera
    # `404.html` e afins como arquivos soltos.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    error_page 404 /404.html;

    # Arquivos ocultos nunca sao servidos. Sem isto, um `.env.local` que
    # acabasse dentro da pasta publicada por engano seria baixavel.
    location ~ /\. {
        deny all;
        return 404;
    }
}
